<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이두 컬 카운터 - MediaPipe Web</title>
    <!-- Tailwind CSS (스타일) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google MediaPipe Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        /* 웹캠 화면 거울 모드 (좌우 반전) */
        #output_canvas {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

    <!-- 상단 타이틀 -->
    <header class="text-center my-4">
        <h1 class="text-3xl font-extrabold text-emerald-400">💪 AI Bicep Curl Counter</h1>
        <p class="text-slate-400 text-sm mt-1">웹캠을 바라보고 오른팔로 이두 컬 운동을 진행하세요.</p>
    </header>

    <!-- 대시보드 통계 패널 -->
    <div class="grid grid-cols-3 gap-4 w-full max-w-2xl mb-4">
        <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700 shadow-md">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">횟수 (Reps)</span>
            <div id="counter-val" class="text-4xl font-black text-emerald-400 mt-1">0</div>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700 shadow-md">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">단계 (Stage)</span>
            <div id="stage-val" class="text-3xl font-bold text-amber-400 mt-1">--</div>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700 shadow-md">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">현재 각도</span>
            <div id="angle-val" class="text-3xl font-bold text-sky-400 mt-1">0°</div>
        </div>
    </div>

    <!-- 진행 바 (수축률 게이지) -->
    <div class="w-full max-w-2xl bg-slate-800 rounded-full h-4 mb-4 overflow-hidden border border-slate-700">
        <div id="progress-bar" class="bg-emerald-500 h-4 transition-all duration-75" style="width: 0%"></div>
    </div>

    <!-- 웹캠 화면 영역 -->
    <div class="relative w-full max-w-2xl bg-black rounded-2xl overflow-hidden shadow-2xl aspect-[4/3] flex items-center justify-center">
        <video id="input_video" class="hidden" playsinline></video>
        <canvas id="output_canvas" class="w-full h-full object-cover"></canvas>

        <!-- 카메라 로딩 안내 -->
        <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 bg-opacity-80">
            <div class="w-10 h-10 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-4 text-emerald-400 font-medium">카메라 및 AI 모델 로딩 중...</p>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const counterEl = document.getElementById('counter-val');
        const stageEl = document.getElementById('stage-val');
        const angleEl = document.getElementById('angle-val');
        const progressEl = document.getElementById('progress-bar');
        const loadingEl = document.getElementById('loading');

        let counter = 0;
        let stage = null;
        const UP_ANGLE = 40;     // 완전 수축 각도
        const DOWN_ANGLE = 160;  // 완전 이완 각도

        // 횟수 성공 시 삐- 효과음 (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // 삼각함수로 각도 계산
        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs((radians * 180.0) / Math.PI);
            if (angle > 180.0) {
                angle = 360.0 - angle;
            }
            return angle;
        }

        // MediaPipe Pose 결과 처리
        function onResults(results) {
            loadingEl.style.display = 'none';

            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                // 오른팔 (12: 어깨, 14: 팔꿈치, 16: 손목)
                const shoulder = landmarks[12];
                const elbow = landmarks[14];
                const wrist = landmarks[16];

                if (shoulder && elbow && wrist && 
                    shoulder.visibility > 0.5 && elbow.visibility > 0.5 && wrist.visibility > 0.5) {
                    
                    const angle = calculateAngle(shoulder, elbow, wrist);
                    angleEl.innerText = `${Math.round(angle)}°`;

                    // 진행률 게이지 바 (0 ~ 100%)
                    let progress = ((DOWN_ANGLE - angle) / (DOWN_ANGLE - UP_ANGLE)) * 100;
                    progress = Math.max(0, Math.min(100, progress));
                    progressEl.style.width = `${progress}%`;

                    // 이두 컬 카운트 상태 판별
                    if (angle > DOWN_ANGLE) {
                        stage = "DOWN";
                        stageEl.innerText = "DOWN";
                        stageEl.className = "text-3xl font-bold text-amber-400 mt-1";
                    }
                    if (angle < UP_ANGLE && stage === "DOWN") {
                        stage = "UP";
                        counter++;
                        counterEl.innerText = counter;
                        stageEl.innerText = "UP";
                        stageEl.className = "text-3xl font-bold text-emerald-400 mt-1";
                        playBeep();
                    }
                }

                // 스켈레톤 선 그리기
                drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, { color: '#00FFC8', lineWidth: 4 });
                drawLandmarks(canvasCtx, [shoulder, elbow, wrist], { color: '#FF0055', lineWidth: 2, radius: 6 });
            }
            canvasCtx.restore();
        }

        // 포즈 모델 초기화
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });
        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        pose.onResults(onResults);

        // 웹캠 시작
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
